<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA AI</title>

<style>
body {
background:#080814;
color:white;
font-family:Arial;
padding:15px;
}
h1 {
color:#a855f7;
text-align:center;
}
#chat {
background:#17172b;
height:55vh;
overflow-y:auto;
padding:12px;
border-radius:15px;
}
.message {
background:#292943;
padding:12px;
margin:10px 0;
border-radius:12px;
}
input {
width:65%;
padding:14px;
border-radius:10px;
border:0;
}
button {
padding:14px;
background:#9333ea;
color:white;
border:0;
border-radius:10px;
}
</style>
</head>

<body>

<h1>NEXORA AI 💎</h1>
<p style="text-align:center">Ton assistant intelligent</p>

<div id="chat">
<div class="message">
Bonjour ! Je suis NEXORA AI. Comment puis-je t'aider ?
</div>
</div>

<br>

<input id="question" placeholder="Écris ton message...">
<button onclick="envoyer()">Envoyer</button>

<script>
async function envoyer() {
let input = document.getElementById("question");
let chat = document.getElementById("chat");
let texte = input.value.trim();

if (!texte) return;

chat.innerHTML +=
'<div class="message"><b>Toi :</b> ' + texte + '</div>';

input.value = "";

let attente = document.createElement("div");
attente.className = "message";
attente.innerText = "NEXORA réfléchit...";
chat.appendChild(attente);

try {
let resultat = await fetch("/chat", {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify({message: texte})
});

let donnees = await resultat.json();

attente.innerText = "NEXORA : " + donnees.response;

} catch (erreur) {
attente.innerText = "Erreur de connexion.";
}

chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
