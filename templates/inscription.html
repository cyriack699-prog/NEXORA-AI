<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Créer un compte - NEXORA</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#17264b,#090d18 65%);color:#fff;font-family:Arial,sans-serif}
.card{width:100%;max-width:390px;padding:30px 24px;border:1px solid #293858;border-radius:22px;background:#101827eF;box-shadow:0 20px 70px #0008}
.logo{text-align:center;font-size:27px;font-weight:800;letter-spacing:3px;color:#a9baff;margin-bottom:12px}
h1{text-align:center;font-size:23px;margin:12px 0 8px}p{text-align:center;color:#aab5c8;font-size:14px;margin-bottom:25px}
label{display:block;margin:15px 0 7px;color:#dce4f5;font-size:14px}
input{width:100%;padding:14px;border:1px solid #34435e;border-radius:11px;background:#0b1220;color:white;font-size:16px;outline:none}
input:focus{border-color:#829bff}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#526fff,#8b5cf6);color:white;font-size:16px;font-weight:bold}
a{color:#a9baff;text-decoration:none}.bottom{text-align:center;margin-top:22px;font-size:14px}
.flash{padding:10px;border-radius:9px;background:#572c3a;color:#ffdce5;margin:12px 0;font-size:14px}
</style>
</head>
<body><main class="card">
<div class="logo">NEXORA AI</div>
<h1>Créer un compte</h1>
<p>Rejoins ton espace NEXORA.</p>
{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
<form method="POST" action="/inscription">
<label for="email">Adresse email</label>
<input id="email" type="email" name="email" autocomplete="email" required>
<label for="password">Mot de passe</label>
<input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Créer mon compte</button>
</form>
<div class="bottom">Déjà inscrit ? <a href="/connexion">Se connecter</a></div>
</main></body></html>
